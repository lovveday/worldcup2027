name: Update World Cup 2026 Stats

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC every day during the tournament.
    # Adjust as you like — more frequent during knockout days is fine,
    # the script only spends API calls on NEWLY finished matches.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run stats update
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_stats.py

      - name: Commit and push updated workbook
        run: |
          git config user.name "wc2026-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/world_cup_2026.xlsx
          git diff --quiet --cached || git commit -m "Update World Cup 2026 stats $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
